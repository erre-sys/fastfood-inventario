# Development only: Swagger UI over the contract file (contract-first, not generated from code).
# Open /swagger-ui.html and authorize with a Keycloak token of the realm erre.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Relative to /swagger-ui/index.html, so it also works behind the /api/v1/inventario prefix
springdoc.swagger-ui.url=../openapi/inventory-api.yaml
