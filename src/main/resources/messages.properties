# User-facing messages of the API, in Spanish (the only language for now). Keys in English.
# Problem Details: problem.<CODE>.title and problem.<CODE>.detail. {0}, {1}... are arguments.
problem.VALIDATION_FAILED.title=Datos no válidos
problem.VALIDATION_FAILED.detail=Revisa los campos marcados.
problem.EMPTY_PATCH.detail=Envía al menos un campo para cambiar.
problem.UNIT_NOT_FOUND.title=Unidad no encontrada
problem.UNIT_NOT_FOUND.detail=No existe una unidad con el código «{0}».
problem.UNIT_ALREADY_EXISTS.title=La unidad ya existe
problem.UNIT_ALREADY_EXISTS.detail=Ya existe una unidad con el código «{0}».
problem.INVALID_CONVERSION.title=Conversión no válida
problem.INVALID_CONVERSION.detail=No se puede convertir {0} ({1}) a {2} ({3}).
problem.ITEM_NOT_FOUND.title=Insumo no encontrado
problem.ITEM_NOT_FOUND.detail=No existe el insumo solicitado.
problem.ITEM_ALREADY_EXISTS.title=El insumo ya existe
problem.ITEM_ALREADY_EXISTS.detail=Ya existe un insumo con el nombre «{0}».
problem.CATEGORY_NOT_FOUND.title=Categoría no encontrada
problem.CATEGORY_NOT_FOUND.detail=No existe la categoría solicitada.
problem.CATEGORY_ALREADY_EXISTS.title=La categoría ya existe
problem.CATEGORY_ALREADY_EXISTS.detail=Ya existe una categoría con el nombre «{0}».
problem.FORBIDDEN.title=Acceso denegado
problem.FORBIDDEN.detail=No tienes permiso para realizar esta operación.
problem.UNSUPPORTED_MEDIA_TYPE.title=Tipo de contenido no soportado
problem.UNSUPPORTED_MEDIA_TYPE.detail=Esta operación no acepta el tipo de contenido enviado.

