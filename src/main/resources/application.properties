spring.application.name=inventario

# El esquema lo maneja Flyway: Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
# Sin sesiones de base abiertas durante la vista: evita consultas ocultas
spring.jpa.open-in-view=false

# Salud para Kubernetes (startup, readiness, liveness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
