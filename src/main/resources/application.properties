spring.application.name=inventario

# Flyway owns the schema: Hibernate only validates that it matches
spring.jpa.hibernate.ddl-auto=validate
# No database session held open while rendering the response: avoids hidden queries
spring.jpa.open-in-view=false
# Dates in UTC end to end (timestamptz <-> Instant); local time is a presentation concern
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Virtual threads: one cheap thread per request. The connection pool still caps database concurrency
spring.threads.virtual.enabled=true
# Under load, fail fast instead of keeping requests waiting 30 s for a database connection
spring.datasource.hikari.connection-timeout=5000

# Actuator on its own port, never published by the Ingress. In the cluster the chart sets it
management.server.port=8081
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Liveness: only the process, so a database outage never restarts pods.
# Readiness: the process and the database, so traffic stops while the database is unreachable
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Keycloak tokens: realm erre (in the cluster it is overridden with KEYCLOAK_ISSUER_URI)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://auth.dev.erre.cloud/realms/erre}

# The contract rejects unknown fields in every request body (additionalProperties: false)
spring.jackson.deserialization.fail-on-unknown-properties=true

# Swagger UI is off by default; the dev profile turns it on (application-dev.properties)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Behind Traefik: X-Forwarded-Prefix (/api/v1/inventario, from StripPrefix), host and proto
# rebuild the public URLs (Location, Problem instance). Safe because the service is only
# reachable through the Ingress (ClusterIP).
server.forward-headers-strategy=framework
