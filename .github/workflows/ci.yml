name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Permisos mínimos: el workflow solo lee el repo, salvo donde un job pida más.
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SONAR_MAVEN_VERSION: 5.9.0.7382
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  compilar-y-probar:
    name: compilar-y-probar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar usa el historial para saber qué código es nuevo
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Compilar, probar y verificar (ArchUnit, Spotless, JaCoCo)
        run: ./mvnw -B -ntp verify
      - name: Análisis de SonarCloud (con quality gate)
        # Los PR desde forks y de Dependabot no reciben secretos: ahí se omite.
        if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:${SONAR_MAVEN_VERSION}:sonar -Dsonar.qualitygate.wait=true

  secretos:
    name: secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial
      - name: gitleaks (CLI; la acción oficial exige licencia en organizaciones)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --verbose

  dependencias:
    name: dependencias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Descargar las dependencias con Maven (usa la caché)
        run: ./mvnw -B -ntp -q dependency:go-offline
      - name: Trivy sobre las dependencias de Maven
        # Lee la caché local (~/.m2) y no consulta Maven Central (--offline-scan):
        # evita el límite de peticiones (429) que comparten los runners de GitHub.
        run: docker run --rm -v "$PWD:/repo" -v "$HOME/.m2:/root/.m2:ro" "$TRIVY_IMAGE" fs --offline-scan --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo

  titulo-pr:
    name: titulo-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # Con squash, el título del PR es el commit que queda en develop.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ramas:
    name: ramas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Validar Gitflow
        # El nombre de la rama lo elige quien abre el PR: va por variable de entorno,
        # nunca interpolado en el script, para evitar inyección de comandos.
        env:
          RAMA: ${{ github.head_ref }}
          DESTINO: ${{ github.base_ref }}
        run: |
          echo "PR de '$RAMA' hacia '$DESTINO'"
          case "$DESTINO" in
            main)    patron='^(release|hotfix)/[a-z0-9._-]+$' ;;
            develop) patron='^(feature|bugfix|release|hotfix)/[a-z0-9._-]+$|^dependabot/' ;;
            *)       echo "Destino no permitido: $DESTINO"; exit 1 ;;
          esac
          if [[ "$RAMA" =~ $patron ]]; then
            echo "Rama válida para $DESTINO"
          else
            echo "::error::La rama '$RAMA' no puede ir a '$DESTINO'. Esperado: $patron"
            exit 1
          fi

  publicar-imagen:
    name: publicar-imagen
    # Solo al llegar a develop o main, y solo si pasaron las pruebas y los escaneos.
    if: github.event_name == 'push'
    needs: [compilar-y-probar, secretos, dependencias]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # publicar en GHCR
      id-token: write      # firmar la atestación de origen
      attestations: write
    env:
      IMAGEN: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.licenses="AGPL-3.0-only" \
            -t "$IMAGEN:$TAG" .
      - name: Tamaño de la imagen
        run: |
          docker image inspect "$IMAGEN:$TAG" --format 'Tamaño real: {{.Size}} bytes'
          docker history "$IMAGEN:$TAG" --format '{{.Size}}\t{{.CreatedBy}}' | head -12
      - name: Trivy sobre la imagen (no se publica si hay vulnerabilidades altas o críticas corregibles)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGEN:$TAG"
      - name: Publicar en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGEN:$TAG"
          echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGEN:$TAG" | cut -d@ -f2)" >> "$GITHUB_ENV"
      - name: Atestación de origen (quién y desde qué commit se construyó)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGEN }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

  proponer-despliegue:
    name: proponer-despliegue
    # Solo en develop, en el repo de la organización, después de publicar la imagen.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository_owner == 'erre-sys'
    needs: [publicar-imagen]
    runs-on: ubuntu-24.04
    # El entorno dev solo acepta la rama develop, y es el único que tiene la llave de la App.
    # Para exigir aprobación humana en el futuro: Settings → Environments → dev → Required reviewers.
    environment: dev
    permissions:
      contents: read
    env:
      SERVICIO: inventario
      NEGOCIO: erre-dev
    steps:
      - name: Token temporal de la App (1 hora, solo erre-deploy)
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DESPLIEGUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DESPLIEGUE_APP_KEY }}
          owner: erre-sys
          repositories: erre-deploy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: erre-sys/erre-deploy
          token: ${{ steps.token.outputs.token }}
          path: deploy
      - name: Cambiar la etiqueta, abrir el PR y mergearlo
        working-directory: deploy
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          ARCHIVO="workloads/negocio/$NEGOCIO/$SERVICIO/values.yaml"
          RAMA="despliegue/$NEGOCIO-$SERVICIO-$TAG"

          # Si el formato de los values cambia, fallar en vez de "no desplegar" en silencio.
          if ! grep -qE '^  tag: ' "$ARCHIVO"; then
            echo "::error::$ARCHIVO no tiene la línea '  tag:' (formato de los values del chart)"
            exit 1
          fi
          sed -i -E "s/^(  tag: ).*/\1$TAG/" "$ARCHIVO"
          if git diff --quiet; then
            echo "La etiqueta $TAG ya está desplegada"
            exit 0
          fi

          # Resguardo: el único cambio permitido es una línea de etiqueta.
          CAMBIOS=$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a" "d}')
          if [ "$CAMBIOS" != "1 1" ] || ! git diff -U0 | grep -qE '^\+  tag: sha-[0-9a-f]{7}$'; then
            echo "::error::El cambio no es solo la etiqueta; no se mergea"
            git diff
            exit 1
          fi

          git config user.name "erre-despliegue[bot]"
          git config user.email "erre-despliegue[bot]@users.noreply.github.com"
          git switch -c "$RAMA"
          git commit -am "deploy($NEGOCIO): $SERVICIO $TAG"
          git push origin "$RAMA"

          URL=$(gh pr create --base main --head "$RAMA" \
            --title "deploy($NEGOCIO): $SERVICIO $TAG" \
            --body "Imagen \`ghcr.io/$GITHUB_REPOSITORY:$TAG\`, construida desde $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA. Ejecución: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh pr merge "$URL" --squash --delete-branch
          echo "Desplegado: $URL"
