spring.application.name=inventario

# Flyway owns the schema: Hibernate only validates that it matches
spring.jpa.hibernate.ddl-auto=validate
# No database session held open while rendering the response: avoids hidden queries
spring.jpa.open-in-view=false

# Health for Kubernetes (startup, readiness, liveness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Keycloak tokens: realm erre (in the cluster it is overridden with KEYCLOAK_ISSUER_URI)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://auth.dev.erre.cloud/realms/erre}
